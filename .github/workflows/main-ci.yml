name: SSBMax CI

on:
  push:
    branches: [ main, develop, feature/*, feature/**, tech-debt/**, PsyTests ]
  pull_request:
    branches: [ main, develop ]

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=true -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  # ── Security (runs in parallel with build jobs) ──────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: API Key & Secret Detection (Files)
        run: |
          echo "🔍 Scanning for Gemini API keys in tracked files..."
          if git ls-files | xargs grep -l "AIza[A-Za-z0-9_-]\{35\}" 2>/dev/null; then
            echo "❌ ERROR: Gemini API key detected in tracked files!"
            exit 1
          fi

      - name: Verify sensitive files are not tracked
        run: |
          echo "🔍 Checking for sensitive files in git..."
          SENSITIVE_FILES=("local.properties" "functions/.env" "functions/.env.local" ".env" "google-services.json" "service-account.json" "firebase-admin-key.json")
          FOUND_SENSITIVE=0
          for file in "${SENSITIVE_FILES[@]}"; do
            if git ls-files | grep -q "^${file}$"; then
              echo "❌ ERROR: Sensitive file tracked: $file"
              FOUND_SENSITIVE=1
            fi
          done
          [ $FOUND_SENSITIVE -eq 1 ] && exit 1 || echo "✅ No sensitive files tracked"

      - name: Check for hardcoded secrets in code
        run: |
          echo "🔍 Scanning for hardcoded secrets patterns..."
          PATTERNS=('apiKey\s*=\s*["\x27]AIza' 'GEMINI_API_KEY\s*=\s*["\x27]AIza' 'api_key\s*=\s*["\x27]AIza' 'functions\.config\(\)\.gemini\.key')
          FOUND_SECRETS=0
          for pattern in "${PATTERNS[@]}"; do
            if git grep -E "$pattern" -- '*.kt' '*.java' '*.js' '*.ts' '*.json' '*.xml' 2>/dev/null; then
              echo "❌ Found potential hardcoded secret: $pattern"
              FOUND_SECRETS=1
            fi
          done
          [ $FOUND_SECRETS -eq 1 ] && exit 1 || echo "✅ No hardcoded secrets detected"

      - name: Validate .gitignore coverage
        run: |
          echo "🔍 Validating .gitignore..."
          REQUIRED=("local.properties" "*.env" "google-services.json" "service-account.json")
          for pattern in "${REQUIRED[@]}"; do
            if ! grep -q "$pattern" .gitignore; then
              echo "⚠️  WARNING: .gitignore missing pattern: $pattern"
              exit 1
            fi
          done

      - name: Check for API keys in commit messages
        run: |
          echo "🔍 Scanning commit messages for secrets..."
          if git log --all --oneline -50 | grep -i "AIza[A-Za-z0-9_-]\{35\}"; then
            echo "❌ ERROR: API key found in commit messages!"
            exit 1
          fi
          echo "✅ Security checks passed"

  # ── Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'test_key' }}" >> local.properties

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Run Lint
        run: ./gradlew lintDebug --build-cache --parallel --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          retention-days: 7

  # ── Unit Tests (all modules) ─────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'test_key' }}" >> local.properties

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Run All Unit Tests
        run: |
          ./gradlew \
            :app:testDebugUnitTest \
            :core:domain:test \
            :core:data:testDebugUnitTest \
            :lint:test \
            --build-cache \
            --parallel \
            --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # ── Build APK (depends on lint + tests passing) ──────────────────────
  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY || 'test_key' }}" >> local.properties

      - name: Setup google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "${GOOGLE_SERVICES_JSON}" > app/google-services.json

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --build-cache --parallel --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: CI Summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Build APK | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
