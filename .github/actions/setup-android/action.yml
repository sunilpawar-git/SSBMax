name: Setup Android Build
description: >
  Shared setup for SSBMax CI jobs — JDK 21, Gradle with caching, and the local
  secrets (local.properties, google-services.json) every Gradle invocation needs.
  Assumes the calling job has already run actions/checkout.

inputs:
  gemini-api-key:
    description: Gemini API key written to local.properties.
    required: false
    default: test_key
  google-services-json:
    description: Contents of app/google-services.json (empty to skip).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      with:
        # Only main/develop may write the shared cache; PR/feature branches read
        # it, so a poisoned feature build can't corrupt the cache for everyone.
        cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

    - name: Create local.properties
      shell: bash
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "GEMINI_API_KEY=${{ inputs.gemini-api-key }}" >> local.properties

    - name: Setup google-services.json
      if: ${{ inputs.google-services-json != '' }}
      shell: bash
      env:
        GOOGLE_SERVICES_JSON: ${{ inputs.google-services-json }}
      run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
