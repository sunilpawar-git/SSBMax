<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" width="700" height="260" font-family="Arial,sans-serif">
  <rect width="700" height="260" fill="white"/>

  <!-- Arrow helper: up arrow at (cx,cy) h=height -->
  <!-- Series pattern: each step, leftmost ↓ converts to ↑ -->

  <!-- ══ GIVEN SERIES (3 figures) ══ -->
  <!-- Series Fig 1: ↑↑↑↓↓↓ -->
  <g transform="translate(10,10)">
    <!-- up -->
    <text x="12"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="32"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="52"  y="70" font-size="28" text-anchor="middle">↑</text>
    <!-- down -->
    <text x="72"  y="70" font-size="28" text-anchor="middle">↓</text>
    <text x="92"  y="70" font-size="28" text-anchor="middle">↓</text>
    <text x="112" y="70" font-size="28" text-anchor="middle">↓</text>
  </g>

  <!-- Series Fig 2: ↑↑↑↑↓↓ -->
  <g transform="translate(140,10)">
    <text x="12"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="32"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="52"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="72"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="92"  y="70" font-size="28" text-anchor="middle">↓</text>
    <text x="112" y="70" font-size="28" text-anchor="middle">↓</text>
  </g>

  <!-- Series Fig 3: ↑↑↑↑↑↓ -->
  <g transform="translate(270,10)">
    <text x="12"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="32"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="52"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="72"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="92"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="112" y="70" font-size="28" text-anchor="middle">↓</text>
  </g>

  <!-- ══ OPTIONS 1–5 ══ -->
  <!-- Divider line -->
  <line x1="10" y1="105" x2="690" y2="105" stroke="#ccc" stroke-width="1" stroke-dasharray="4"/>

  <!-- Option labels -->
  <text x="65"  y="128" font-size="13" font-weight="bold" text-anchor="middle">1</text>
  <text x="200" y="128" font-size="13" font-weight="bold" text-anchor="middle">2</text>
  <text x="335" y="128" font-size="13" font-weight="bold" text-anchor="middle">3</text>
  <text x="470" y="128" font-size="13" font-weight="bold" text-anchor="middle">4</text>
  <text x="605" y="128" font-size="13" font-weight="bold" text-anchor="middle">5</text>

  <!-- Option 1: ↓↑↑↑↑↑ (wrong: down first) -->
  <g transform="translate(10,135)">
    <text x="12"  y="70" font-size="28" text-anchor="middle">↓</text>
    <text x="32"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="52"  y="70" font-size="28" text-anchor="middle">↑</text>
    <text x="72"  y="70" font-size="28" text-anchor="middle">↑</text>
