<svg viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg"
     width="820" height="360" font-family="Arial, sans-serif">

  <!-- ── BACKGROUND ─────────────────────────────────────── -->
  <rect width="820" height="360" fill="white"/>

  <!-- ── SECTION LABELS ─────────────────────────────────── -->
  <text x="195" y="22" font-size="15" font-weight="bold" text-anchor="middle">Group A</text>
  <text x="610" y="22" font-size="15" font-weight="bold" text-anchor="middle">Group B</text>

  <!-- ── VERTICAL DIVIDER ───────────────────────────────── -->
  <line x1="405" y1="10" x2="405" y2="160" stroke="#bbb" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- ════════════════════════════════════════════════════
       CUBE TEMPLATE: top=parallelogram, left+right=parallelograms
       Bounding box per cube: ~90 × 80 px
       translate(X, Y) moves the whole cube group

       Face polygons (relative coords):
         top:   "25,0 75,0 95,25 45,25"
         left:  "5,25 45,25 45,75 5,50"
         right: "45,25 95,25 95,75 45,75"

       Letter centers (relative):
         top:   x=58, y=17
         left:  x=23, y=52
         right: x=70, y=54
  ════════════════════════════════════════════════════ -->

  <!-- ── GROUP A · Cube 1 → top=c, left=t, right=q ──── -->
  <g transform="translate(20,30)">
    <polygon points="25,0 75,0 95,25 45,25" fill="white" stroke="black" stroke-width="1.5"/>
    <polygon points="5,25 45,25 45,75 5,50"  fill="#f5f5f5" stroke="black" stroke-width="1.5"/>
    <polygon points="45,25 95,25 95,75 45,75" fill="#ececec" stroke="black" stroke-width="1.5"/>
    <text x="58" y="19" font-size="15" text-anchor="middle" font-style="italic">c</text>
    <text x="23" y="54" font-size="15" text-anchor="middle" font-style="italic">t</text>
    <text x="72" y="54" font-size="15" text-anchor="middle" font-style="italic">q</text>
  </g>

  <!-- ── GROUP A · Cube 2 → top=q, left=d, right=r ──── -->
  <g transform="translate(130,30)">
    <polygon points="25,0 75,0 95,25 45,25" fill="white" stroke="black" stroke-width="1.5"/>
    <polygon points="5,25 45,25 45,75 5,50"  fill="#f5f5f5" stroke="black" stroke-width="1.5"/>
    <polygon points="45,25 95,25 95,75 45,75" fill="#ececec" stroke="black" stroke-width="1.5"/>
    <text x="58" y="19" font-size="15" text-anchor="middle" font-style="italic">q</text>
    <text x="23" y="54" font-size="15" text-anchor="middle" font-style="italic">d</text>
    <text x="72" y="54" font-size="15" text-anchor="middle" font-style="italic">r</text>
  </g>

  <!-- ── GROUP A · Cube 3 → top=b, left=s, right=c ──── -->
  <g transform="translate(240,30)">
    <polygon points="25,0 75,0 95,25 45,25" fill="white" stroke="black" stroke-width="1.5"/>
    <polygon points="5,25 45,25 45,75 5,50"  fill="#f5f5f5" stroke="black" stroke-width="1.5"/>
    <polygon points="45,25 95,25 95,75 45,75" fill="#ececec" stroke="black" stroke-width="1.5"/>
    <text x="58" y="19" font-size="15" text-anchor="middle" font-style="italic">b</text>
    <text x="23" y="54" font-size="15" text-anchor="middle" font-style="italic">s</text>
    <text x="72" y="54" font-size="15" text-anchor="middle" font-style="italic">c</text>
  </g>

  <!-- ── GROUP B · Cube 1 → top=e, left=a, right=o ──── -->
  <g transform="translate(420,30)">
    <polygon points="25,0 75,0 95,25 45,25" fill="white" stroke="black" stroke-width="1.5"/>
    <polygon points="5,25 45,25 45,75 5,50"  fill="#f5f5f5" stroke="black" stroke-width="1.5"/>
    <polygon points="45,25 95,25 95,75 45,75" fill="#ececec" stroke="black" stroke-width="1.5"/>
    <text x="58" y="19" font-size="15" text-anchor="middle" font-style="italic">e</text>
    <text x="23" y="54" font-size="15" text-anchor="middle" font-style="italic">a</text>
    <text x="72" y="54" font-size="15" text-anchor="middle" font-style="italic">o</text>
  </g>

  <!-- ── GROUP B · Cube 2 → top=u, left=o, right=a ──── -->
  <g transform="translate(530,30)">
    <polygon points="25,0 75,0 95,25 45,25" fill="white" stroke="black" stroke-width="1.5"/>
    <polygon points="5,25 45,25 45,75 5,50"  fill="#f5f5f5" stroke="black" stroke-width="1.5"/>
    <polygon points="45,25 95,25 95,75 45,75" fill="#ececec" stroke="black" stroke-width="1.5"/>
    <text x="58" y="19" font-size="15" text-anchor="middle" font-style="italic">u</text>
    <text x="23" y="54" font-size="15" text-anchor="middle" font-style="italic">o</text>
    <text x="72" y="54" font-size="15" text-anchor="middle" font-style="italic">a</text>
  </g>

  <!-- ── GROUP B · Cube 3 → top=i, left=e, right=u ──── -->
  <g transform="translate(640,30)">
    <polygon points="25,0 75,0 95,25 45,25" fill="white" stroke="black" stroke-width="1.5"/>
    <polygon points="5,25 45,25 45,75 5,50"  fill="#f5f5f5" stroke="black" stroke-width="1.5"/>
    <polygon points="45,25 95,25 95,75 45,75" fill="#ececec" stroke="black" stroke-width="1.5"/>
    <text x="58" y="19" font-size="15" text-anchor="middle" font-style="italic">i</text>
    <text x="23" y="54" font-size="15" text-anchor="middle" font-style="italic">e</text>
    <text x="72" y="54" font-size="15" text-anchor="middle" font-style="italic">u</text>
  </g>

  <!-- ── QUESTION NUMBER + TEXT ─────────────────────────── -->
  <text x="20" y="145" font-size="16" font-weight="bold">1.</text>

  <!-- ── OPTION LABELS ──────────────────────────────────── -->
  <text x="85"  y="210" font-size="14" font-weight="bold" text-anchor="middle">1</text>
  <text x="285" y="210" font-size="14" font-weight="bold" text-anchor="middle">2</text>
  <text x="485" y="210" font-size="14" font-weight="bold" text-anchor="middle">3</text>

  <!-- ── OPTION 1 → top=d, left=a, right=z ─────────────── -->
  <g transform="translate(38,220)">
    <polygon points="25,0 75,0 95,25 45,25" fill="white" stroke="black" stroke-width="1.5"/>
    <polygon points="5,25 45,25 45,75 5,50"  fill="#f5f5f5" stroke="black" stroke-width="1.5"/>
    <polygon points="45,25 95,25 95,75 45,75" fill="#ececec" stroke="black" stroke-width="1.5"/>
    <text x="58" y="19" font-size="15" text-anchor="middle" font-style="italic">d</text>
    <text x="23" y="54" font-size="15" text-anchor="middle" font-style="italic">a</text>
    <text x="72" y="54" font-size="15" text-anchor="middle" font-style="italic">z</text>
  </g>

  <!-- ── OPTION 2 → top=e, left=q, right=o ─────────────── -->
  <g transform="translate(238,220)">
    <polygon points="25,0 75,0 95,25 45,25" fill="white" stroke="black" stroke-width="1.5"/>
    <polygon points="5,25 45,25 45,75 5,50"  fill="#f5f5f5" stroke="black" stroke-width="1.5"/>
    <polygon points="45,25 95,25 95,75 45,75" fill="#ececec" stroke="black" stroke-width="1.5"/>
    <text x="58" y="19" font-size="15" text-anchor="middle" font-style="italic">e</text>
    <text x="23" y="54" font-size="15" text-anchor="middle" font-style="italic">q</text>
    <text x="72" y="54" font-size="15" text-anchor="middle" font-style="italic">o</text>
  </g>

  <!-- ── OPTION 3 → top=c, left=m, right=y ─────────────── -->
  <g transform="translate(438,220)">
    <polygon points="25,0 75,0 95,25 45,25" fill="white" stroke="black" stroke-width="1.5"/>
    <polygon points="5,25 45,25 45,75 5,50"  fill="#f5f5f5" stroke="black" stroke-width="1.5"/>
    <polygon points="45,25 95,25 95,75 45,75" fill="#ececec" stroke="black" stroke-width="1.5"/>
    <text x="58" y="19" font-size="15" text-anchor="middle" font-style="italic">c</text>
    <text x="23" y="54" font-size="15" text-anchor="middle" font-style="italic">m</text>
    <text x="72" y="54" font-size="15" text-anchor="middle" font-style="italic">y</text>
  </g>

</svg>
