<svg viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" width="700" height="300" font-family="Arial,sans-serif">
  <rect width="700" height="300" fill="white"/>

  <!-- Section labels -->
  <text x="130" y="18" font-size="13" font-weight="bold" text-anchor="middle">Class A</text>
  <text x="510" y="18" font-size="13" font-weight="bold" text-anchor="middle">Class B</text>
  <line x1="10" y1="22" x2="350" y2="22" stroke="black" stroke-width="1"/>
  <line x1="10" y1="22" x2="10" y2="100" stroke="black" stroke-width="1"/>
  <line x1="350" y1="22" x2="350" y2="100" stroke="black" stroke-width="1"/>
  <line x1="10" y1="100" x2="350" y2="100" stroke="black" stroke-width="1"/>

  <line x1="365" y1="22" x2="695" y2="22" stroke="black" stroke-width="1"/>
  <line x1="365" y1="22" x2="365" y2="100" stroke="black" stroke-width="1"/>
  <line x1="695" y1="22" x2="695" y2="100" stroke="black" stroke-width="1"/>
  <line x1="365" y1="100" x2="695" y2="100" stroke="black" stroke-width="1"/>

  <!-- CLASS A: outer square + inner square -->
  <g transform="translate(30,30)">
    <rect x="0" y="0" width="70" height="60" fill="none" stroke="black" stroke-width="2"/>
    <rect x="12" y="10" width="46" height="40" fill="none" stroke="black" stroke-width="1.5"/>
  </g>
  <!-- CLASS A: outer circle + inner circle -->
  <g transform="translate(130,30)">
    <ellipse cx="35" cy="30" rx="34" ry="29" fill="none" stroke="black" stroke-width="2"/>
    <ellipse cx="35" cy="30" rx="20" ry="17" fill="none" stroke="black" stroke-width="1.5"/>
  </g>
  <!-- CLASS A: outer triangle + inner triangle -->
  <g transform="translate(225,30)">
    <polygon points="35,2 68,60 2,60" fill="none" stroke="black" stroke-width="2"/>
    <polygon points="35,18 55,52 15,52" fill="none" stroke="black" stroke-width="1.5"/>
  </g>

  <!-- CLASS B: angled open shape (bent line, like ⌐ ) -->
  <g transform="translate(385,30)">
    <path d="M 5,55 L 5,10 L 60,10" fill="none" stroke="black" stroke-width="2.5"/>
  </g>
  <!-- CLASS B: crescent moon shape -->
  <g transform="translate(480,30)">
    <path d="M 50,30 A 25,28 0 1 1 50,31 Z" fill="none" stroke="black" stroke-width="2"/>
    <path d="M 38,10 A 20,24 0 0 0 38,50" fill="white" stroke="white" stroke-width="3"/>
    <path d="M 38,10 A 20,24 0 0 0 38,50" fill="none" stroke="black" stroke-width="1.5"/>
  </g>
  <!-- CLASS B: circle with two curved lines through it (not fully inside) -->
  <g transform="translate(575,30)">
    <ellipse cx="35" cy="30" rx="30" ry="28" fill="none" stroke="black" stroke-width="2"/>
    <path d="M 10,10 Q 35,30 10,50" fill="none" stroke="black" stroke-width="1.5"/>
    <path d="M 60,10 Q 35,30 60,50" fill="none" stroke="black" stroke-width="1.5"/>
  </g>

  <!-- Question text -->

  <!-- Option labels -->
  <text x="85"  y="148" font-size="13" font-weight="bold" text-anchor="middle">1</text>
  <text x="235" y="148" font-size="13" font-weight="bold" text-anchor="middle">2</text>
  <text x="385" y="148" font-size="13" font-weight="bold" text-anchor="middle">3</text>
  <text x="535" y="148" font-size="13" font-weight="bold" text-anchor="middle">4</text>

  <!-- Options container -->
  <rect x="15"  y="152" width="140" height="80" fill="none" stroke="black" stroke-width="1"/>
  <rect x="165" y="152" width="140" height="80" fill="none" stroke="black" stroke-width="1"/>
  <rect x="315" y="152" width="140" height="80" fill="none" stroke="black" stroke-width="1"/>
  <rect x="465" y="152" width="140" height="80" fill="none" stroke="black" stroke-width="1"/>

  <!-- Option 1: S-curve (single open shape, NOT two closed) -->
  <g transform="translate(50,165)">
    <path d="M 30,55 C 55,55 55,30 30,30 C 5,30 5,5 30,5" fill="none" stroke="black" stroke-width="2.5"/>
  </g>

  <!-- Option 2: diamond inside diamond (two similar closed figures) ✓ Class A -->
  <g transform="translate(195,162)">
    <polygon points="40,5 72,38 40,71 8,38" fill="none" stroke="black" stroke-width="2"/>
    <polygon points="40,18 58,38 40,58 22,38" fill="none" stroke="black" stroke-width="1.5"/>
  </g>

  <!-- Option 3: pentagon inside pentagon (two similar closed figures) ✓ Class A -->
  <g transform="translate(345,162)">
    <polygon points="40,4 72,27 60,64 20,64 8,27" fill="none" stroke="black" stroke-width="2"/>
    <polygon points="40,18 58,31 50,56 30,56 22,31" fill="none" stroke="black" stroke-width="1.5"/>
  </g>

  <!-- Option 4: rectangle with horizontal lines (NOT two similar closed shapes nesting) -->
  <g transform="translate(495,166)">
    <rect x="5" y="5" width="70" height="55" fill="none" stroke="black" stroke-width="2"/>
    <rect x="18" y="18" width="44" height="30" fill="none" stroke="black" stroke-width="1.5"/>
    <line x1="5" y1="32" x2="75" y2="32" stroke="black" stroke-width="1"/>
  </g>

</svg>
