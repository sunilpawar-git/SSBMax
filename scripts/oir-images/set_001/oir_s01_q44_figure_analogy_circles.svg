<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg" width="700" height="200" font-family="Arial,sans-serif">
  <rect width="700" height="200" fill="white"/>
  <!--
    Q44: A:B::C:?
    A: 4-pointed star outline (✦)
    B: 4-pointed star + 4 filled circles, one at each point tip
    C: 5-pointed star outline (☆)
    Answer: 3 — 5-pointed star + 5 filled circles at each point

    Rule: number of points = number of circles added at the tips.
  -->

  <!-- A: 4-pointed star outline -->
  <text x="55"  y="16" font-size="13" font-weight="bold" text-anchor="middle">A</text>
  <rect x="10" y="20" width="90" height="90" fill="none" stroke="black" stroke-width="1"/>
  <!-- 4-pt star: ✦ -->
  <polygon points="55,22 62,48 88,55 62,62 55,88 48,62 22,55 48,48" fill="none" stroke="black" stroke-width="2"/>

  <!-- IS TO -->
  <text x="115" y="68" font-size="12" text-anchor="middle">IS TO</text>

  <!-- B: 4-pointed star + circles at 4 tips -->
  <text x="175" y="16" font-size="13" font-weight="bold" text-anchor="middle">B</text>
  <rect x="130" y="20" width="90" height="90" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="175,28 182,52 205,60 182,68 175,92 168,68 145,60 168,52" fill="none" stroke="black" stroke-width="2"/>
  <!-- circles at 4 tips -->
  <circle cx="175" cy="28" r="5" fill="black"/>
  <circle cx="205" cy="60" r="5" fill="black"/>
  <circle cx="175" cy="92" r="5" fill="black"/>
  <circle cx="145" cy="60" r="5" fill="black"/>

  <!-- AS -->
  <text x="235" y="75" font-size="12" text-anchor="middle">AS</text>

  <!-- C: 5-pointed star outline (☆) -->
  <text x="295" y="16" font-size="13" font-weight="bold" text-anchor="middle">C</text>
  <rect x="250" y="20" width="90" height="90" fill="none" stroke="black" stroke-width="1"/>
  <!-- 5-pt star, centered at 295,65 -->
  <polygon points="295,25 305,55 335,55 312,72 320,100 295,83 270,100 278,72 255,55 285,55" fill="none" stroke="black" stroke-width="2"/>

  <!-- IS TO -->
  <text x="358" y="75" font-size="12" text-anchor="middle">IS TO</text>

  <!-- Option labels -->
  <text x="400" y="16" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  <text x="453" y="16" font-size="12" font-weight="bold" text-anchor="middle">2</text>
  <text x="506" y="16" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  <text x="559" y="16" font-size="12" font-weight="bold" text-anchor="middle">4</text>
  <text x="615" y="16" font-size="12" font-weight="bold" text-anchor="middle">5</text>

  <!-- Opt 1: 5-pt star with 6 circles (wrong count) -->
  <rect x="376" y="20" width="48" height="90" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="400,25 407,42 425,42 411,52 416,70 400,60 384,70 389,52 375,42 393,42" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="400" cy="25" r="4" fill="black"/>
  <circle cx="425" cy="42" r="4" fill="black"/>
  <circle cx="416" cy="70" r="4" fill="black"/>
  <circle cx="384" cy="70" r="4" fill="black"/>
  <circle cx="375" cy="42" r="4" fill="black"/>
  <circle cx="400" cy="85" r="4" fill="black"/>

  <!-- Opt 2: 5-pt star with 4 circles (wrong, matches 4-pt) -->
  <rect x="429" y="20" width="48" height="90" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="453,25 460,42 478,42 464,52 469,70 453,60 437,70 442,52 428,42 446,42" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="453" cy="25" r="4" fill="black"/>
  <circle cx="478" cy="42" r="4" fill="black"/>
  <circle cx="469" cy="70" r="4" fill="black"/>
  <circle cx="437" cy="70" r="4" fill="black"/>

  <!-- Opt 3: 5-pt star + 5 circles at each point CORRECT -->
  <rect x="482" y="20" width="48" height="90" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="506,25 513,42 531,42 517,52 522,70 506,60 490,70 495,52 481,42 499,42" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="506" cy="25" r="4" fill="black"/>
  <circle cx="531" cy="42" r="4" fill="black"/>
  <circle cx="522" cy="70" r="4" fill="black"/>
  <circle cx="490" cy="70" r="4" fill="black"/>
  <circle cx="481" cy="42" r="4" fill="black"/>

  <!-- Opt 4: 5-pt star with circles INSIDE (not at tips) -->
  <rect x="535" y="20" width="48" height="90" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="559,25 566,42 584,42 570,52 575,70 559,60 543,70 548,52 534,42 552,42" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="559" cy="50" r="4" fill="black"/>
  <circle cx="568" cy="58" r="4" fill="black"/>
  <circle cx="550" cy="58" r="4" fill="black"/>
  <circle cx="565" cy="65" r="4" fill="black"/>
  <circle cx="553" cy="65" r="4" fill="black"/>

  <!-- Opt 5: 4-pt star + 5 circles (star is wrong shape) -->
  <rect x="591" y="20" width="90" height="90" fill="none" stroke="black" stroke-width="1"/>
  <polygon points="636,25 643,50 668,58 643,66 636,90 629,66 604,58 629,50" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="636" cy="25" r="5" fill="black"/>
  <circle cx="668" cy="58" r="5" fill="black"/>
  <circle cx="636" cy="90" r="5" fill="black"/>
  <circle cx="604" cy="58" r="5" fill="black"/>
  <circle cx="636" cy="58" r="5" fill="black"/>
</svg>
