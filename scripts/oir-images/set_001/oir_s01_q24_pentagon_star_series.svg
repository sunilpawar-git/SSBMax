  <!--
    Q24: Series of pentagons and 5-pointed stars in increasing groups.
    Pattern: ⬠☆☆ ⬠☆☆☆ ⬠☆☆☆☆ ⬠☆☆☆☆☆ (pentagons with increasing stars)
    Each pentagon is flanked by 2 stars before and 1 behind, then 3 before and 1 behind...
    Actually from PDF answer: "pentagon placed between 2 symbols in front, 1 in back;
    similarly in front of last pentagon 5-edge stars. The last pattern = 5-edge star = figure 3."

    The series from the image appears to be a long row of shapes:
    ⬠ ☆ ☆ ⬠ ☆ ☆ ☆ ⬠ ☆ ☆ ☆ ☆ ⬠ ...
    And the next shape after this pattern would be another 5-pointed star (figure 3).

    Given the options are:
    1: ⬠ (pentagon)
    2: ✡ (6-pointed star)
    3: ☆ (5-pointed star, outline)
    4: ✦ (4-pointed star)
    5: ⬠ (smaller pentagon)

    Answer: 3 (5-pointed star)
  -->

