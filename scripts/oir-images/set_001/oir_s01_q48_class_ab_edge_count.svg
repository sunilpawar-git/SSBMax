<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg" width="700" height="280" font-family="Arial,sans-serif">
  <rect width="700" height="280" fill="white"/>

  <text x="130" y="18" font-size="13" font-weight="bold" text-anchor="middle">Class A</text>
  <rect x="10" y="22" width="240" height="90" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="490" y="18" font-size="13" font-weight="bold" text-anchor="middle">Class B</text>
  <rect x="370" y="22" width="310" height="90" fill="none" stroke="black" stroke-width="1.5"/>

  <!-- CLASS A: two shapes where one has MORE EDGES than the other -->
  <!-- A1: small square (4 edges) inside larger circle (∞ edges → treated as "different edge count") -->
  <g transform="translate(22,28)">
    <rect x="2" y="2" width="32" height="32" fill="none" stroke="black" stroke-width="1.5"/>
    <!-- 4-pt star above it (more edges visual difference) -->
    <polygon points="42,55 48,68 62,68 50,77 54,90 42,82 30,90 34,77 22,68 36,68" fill="none" stroke="black" stroke-width="1.5"/>
  </g>
  <!-- A2: 4-pointed star (4 main points) + pentagon (5 edges) -->
  <g transform="translate(100,28)">
    <polygon points="35,2 40,28 66,35 40,42 35,68 30,42 4,35 30,28" fill="none" stroke="black" stroke-width="1.5"/>
    <polygon points="35,16 48,25 44,40 26,40 22,25" fill="none" stroke="black" stroke-width="1"/>
  </g>
  <!-- A3: small pentagon (5 edges) inside hexagon (6 edges) -->
  <g transform="translate(185,28)">
    <polygon points="35,2 64,18 64,52 35,68 6,52 6,18" fill="none" stroke="black" stroke-width="1.5"/>
    <polygon points="35,16 54,26 50,48 20,48 16,26" fill="none" stroke="black" stroke-width="1.5"/>
  </g>

  <!-- CLASS B: shapes with SAME edge count or no clear difference -->
  <!-- B1: irregular quadrilateral (all 4 sides, similar count) -->
  <g transform="translate(385,28)">
    <polygon points="5,5 65,15 55,65 5,55" fill="none" stroke="black" stroke-width="1.5"/>
  </g>
  <!-- B2: open cup / irregular shape -->
  <g transform="translate(468,28)">
    <polygon points="5,65 20,5 50,5 65,65" fill="none" stroke="black" stroke-width="1.5"/>
    <line x1="5" y1="65" x2="65" y2="65" stroke="black" stroke-width="1.5"/>
  </g>
  <!-- B3: envelope shape (same type both halves) -->
  <g transform="translate(553,28)">
    <rect x="2" y="15" width="62" height="50" fill="none" stroke="black" stroke-width="1.5"/>
    <polyline points="2,15 33,42 64,15" fill="none" stroke="black" stroke-width="1.5"/>
  </g>


  <text x="85"  y="152" font-size="13" font-weight="bold" text-anchor="middle">1</text>
  <text x="235" y="152" font-size="13" font-weight="bold" text-anchor="middle">2</text>
  <text x="385" y="152" font-size="13" font-weight="bold" text-anchor="middle">3</text>
  <text x="535" y="152" font-size="13" font-weight="bold" text-anchor="middle">4</text>

  <rect x="15"  y="156" width="140" height="90" fill="none" stroke="black" stroke-width="1"/>
  <rect x="165" y="156" width="140" height="90" fill="none" stroke="black" stroke-width="1"/>
  <rect x="315" y="156" width="140" height="90" fill="none" stroke="black" stroke-width="1"/>
  <rect x="465" y="156" width="140" height="90" fill="none" stroke="black" stroke-width="1"/>

  <!-- Option 1: oval + diamond (0 edges oval vs 4 edges diamond = different count) -->
  <g transform="translate(30,170)">
    <ellipse cx="30" cy="35" rx="28" ry="18" fill="none" stroke="black" stroke-width="2"/>
    <polygon points="78,18 98,35 78,52 58,35" fill="none" stroke="black" stroke-width="2"/>
  </g>

  <!-- Option 2: diamond + diamond (same shape = same edge count) NOT Class A -->
  <g transform="translate(178,170)">
    <polygon points="28,12 48,35 28,58 8,35" fill="none" stroke="black" stroke-width="2"/>
    <polygon points="78,12 98,35 78,58 58,35" fill="none" stroke="black" stroke-width="2"/>
  </g>

  <!-- Option 3: irregular parallelogram + pentagon (4 vs 5 edges) ✓ Class A -->
  <g transform="translate(328,170)">
    <polygon points="5,28 45,10 75,28 75,58 5,58" fill="none" stroke="black" stroke-width="2"/>
    <polygon points="10,55 5,30 30,18 55,30 50,55" fill="none" stroke="black" stroke-width="1.5" transform="translate(25,10)"/>
  </g>

  <!-- Option 4: 6-pointed star + pentagon (6 vs 5 edges = different count) ✓ Class A -->
  <g transform="translate(478,165)">
    <polygon points="35,5 43,25 65,25 48,38 55,60 35,47 15,60 22,38 5,25 27,25" fill="none" stroke="black" stroke-width="2"/>
    <polygon points="75,30 90,20 105,30 100,50 80,50" fill="none" stroke="black" stroke-width="2"/>
  </g>

</svg>
