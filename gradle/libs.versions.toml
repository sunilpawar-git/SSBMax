[versions]
agp = "8.7.3"
kotlin = "2.1.0"
detekt = "1.23.7"

# KMP Spike (Phase 0) — shared module only, isolated from existing app/core modules
composeMultiplatform = "1.8.2"
koin = "4.1.0"
koinCompose = "4.1.0"
sqldelight = "2.1.0"
gitliveFirebase = "2.1.0"
ktorClientDarwin = "3.0.2"
kotlinxDatetime = "0.6.2"
kotlinxSerialization = "1.7.3"
multiplatformSettings = "1.3.0"
workManager = "2.9.0"

# Phase 5 (UI): KMP navigation + image loading for shared/commonMain
navigationComposeKmp = "2.9.0-beta02"
coil3 = "3.0.4"
lifecycleKmp = "2.9.0"

# AndroidX Core
coreKtx = "1.15.0"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"

# Compose
composeBom = "2024.05.00"
navigationCompose = "2.8.5"

# Room
room = "2.6.1"

# Ktor (for KMM-compatible networking)
ktor = "3.0.2"

# Coroutines
coroutines = "1.9.0"

# DataStore
datastore = "1.1.1"

# Image Loading
coil = "2.5.0"

# Memory Leak Detection
leakcanary = "2.14"

# AI/ML
generativeai = "0.9.0"

# Testing
junit = "4.13.2"
junitAndroidx = "1.2.1"
espressoCore = "3.6.1"
mockk = "1.13.13"
turbine = "1.2.0"
robolectric = "4.11.1"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Phase 5 (UI): KMP navigation, image loading, lifecycle-compose for shared/commonMain.
# navigation-compose-kmp is the JetBrains-published KMP-compatible artifact (group
# org.jetbrains.androidx.navigation, not androidx.navigation) -- the latter has no
# common/iOS targets yet. lifecycle-runtime-compose/viewmodel-compose ARE published by
# Google under the regular androidx.lifecycle group with real commonMain+iOS targets
# since 2.8.0 (confirmed via maven-metadata before adding), so those reuse the existing
# androidx-lifecycle-* catalog entries above rather than duplicating a KMP-specific one.
navigation-compose-kmp = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigationComposeKmp" }
coil3-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil3" }
coil3-network-ktor3 = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil3" }
# Separate alias (not the app module's androidx-lifecycle-*-compose, pinned at 2.8.7 which
# has no published iOS variant) because CMP 1.8.2's ui-uikitsimarm64 + navigation-compose-kmp
# both transitively pull androidx.lifecycle 2.9.0 for iOS -- confirmed via a real
# "no matching variant" resolution failure at 2.8.7 before bumping just this shared-only alias.
androidx-lifecycle-runtime-compose-kmp = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleKmp" }
androidx-lifecycle-viewmodel-compose-kmp = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleKmp" }

# Phase 3c (#12): commonMain `BackHandler` -- already resolved transitively via
# compose.foundation's own `implementation` dependency, but that scope isn't
# exposed to consumers, so it needs a direct declaration to be on `shared`'s
# compile classpath. Version pinned to composeMultiplatform so it always
# matches the rest of the Compose Multiplatform artifact set.
compose-ui-backhandler = { group = "org.jetbrains.compose.ui", name = "ui-backhandler", version.ref = "composeMultiplatform" }

# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Ktor Client (KMM-compatible networking)
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktorClientDarwin" }
ktor-client-mock = { group = "io.ktor", name = "ktor-client-mock", version.ref = "ktor" }

# KMP Spike (Phase 0)
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koinCompose" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koinCompose" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-test-junit4 = { group = "io.insert-koin", name = "koin-test-junit4", version.ref = "koin" }
